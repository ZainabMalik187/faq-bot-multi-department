<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Bot - Multi Department</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .departments {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .dept-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .dept-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .dept-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            background: #f0f4ff;
            color: #667eea;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 FAQ Bot</h1>
        <p class="subtitle">Multi-Department Support System</p>
        
        <div class="departments">
            <div class="dept-card">
                <h3>💼 Sales</h3>
                <p>Sales inquiries</p>
            </div>
            <div class="dept-card">
                <h3>🎯 Support</h3>
                <p>Customer support</p>
            </div>
            <div class="dept-card">
                <h3>⚙️ Engineering</h3>
                <p>Technical issues</p>
            </div>
        </div>
        
        <div class="status" id="status">
            Connecting to backend...
        </div>
    </div>

    <script>
        async function checkHealth() {
            try {
                const response = await fetch('http://localhost:8000/api/health');
                const data = await response.json();
                document.getElementById('status').textContent = '✅ Backend is online';
            } catch (error) {
                document.getElementById('status').textContent = '⚠️ Backend is offline';
            }
        }
        checkHealth();
    </script>
</body>
</html>
