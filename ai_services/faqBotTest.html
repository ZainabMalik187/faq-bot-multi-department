<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Bot — Test UI</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .chat-container {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    height: 90vh;
    overflow: hidden;
  }
  .chat-header {
    background: #1d4ed8;
    color: #fff;
    padding: 14px 18px;
    font-weight: 600;
    font-size: 16px;
  }
  .chat-header small {
    display: block;
    font-weight: 400;
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #1d4ed8;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #eef0f4;
    color: #1a1a1a;
    border-bottom-left-radius: 4px;
  }
  .msg.bot .dept {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #1d4ed8;
    background: #e0e7ff;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .msg.typing {
    align-self: flex-start;
    background: #eef0f4;
    color: #888;
    font-style: italic;
  }
  .input-bar {
    display: flex;
    border-top: 1px solid #e5e7eb;
    padding: 10px;
    gap: 8px;
  }
  .input-bar input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
  }
  .input-bar input:focus {
    border-color: #1d4ed8;
  }
  .input-bar button {
    background: #1d4ed8;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .input-bar button:disabled {
    background: #93b0f0;
    cursor: not-allowed;
  }
  .settings {
    padding: 8px 16px;
    font-size: 12px;
    color: #666;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .settings input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    FAQ Bot — Test UI
    <small>Connects to your local FastAPI backend</small>
  </div>

  <!-- ── DEPT VALIDATION: frontend department vs question department ─── -->
  <div class="settings">
    Backend URL:
    <input id="apiUrl" value="http://127.0.0.1:8000/chat">
    Department:
    <select id="deptSelect">
      <option value="HR">HR</option>
      <option value="IT">IT</option>
      <option value="Sales">Sales</option>
      <option value="Finance">Finance</option>
      <option value="Customer Support" selected>Customer Support</option>
    </select>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">
      Hi! Ask me anything — e.g. "How do I track my order?" or "How do I apply for leave?"
    </div>
  </div>

  <div class="input-bar">
    <input id="userInput" type="text" placeholder="Type your question..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const apiUrlEl = document.getElementById('apiUrl');

  let currentSessionId = null;

  function addMessage(text, sender, department) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;

    if (sender === 'bot' && department) {
      const badge = document.createElement('span');
      badge.className = 'dept';
      badge.textContent = department;
      div.appendChild(document.createElement('br'));
      div.appendChild(badge);
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.textContent = 'Bot is typing...';
    div.id = 'typingIndicator';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const query = inputEl.value.trim();
    if (!query) return;

    addMessage(query, 'user');
    inputEl.value = '';
    sendBtn.disabled = true;
    addTyping();

    // ── DEPT VALIDATION: frontend department vs question department ───
    const deptEl = document.getElementById('deptSelect');
    const payload = { department: deptEl.value, text: query };
    if (currentSessionId) {
      payload.session_id = currentSessionId;
    }

    try {
      const response = await fetch(apiUrlEl.value, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error('Server returned ' + response.status);
      }

      const data = await response.json();
      if (data.session_id) {
        currentSessionId = data.session_id;
      }
      removeTyping();
      addMessage(data.answer || '(no answer field in response)', 'bot', data.department);

    } catch (err) {
      removeTyping();
      addMessage('Error: ' + err.message + '. Check the backend URL and make sure your server is running.', 'bot');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
